services:
  api:
    build: .
    container_name: catalogobulk_api
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - mongo
      - redis

  mongo:
    image: mongo:7
    container_name: catalogobulk_mongo
    volumes:
      - mongo_data:/data/db
    ports:
      - "27018:27017"

  redis:
    image: redis:7-alpine
    container_name: catalogobulk_redis
    ports:
      - "6380:6379"

volumes:
  mongo_data:
